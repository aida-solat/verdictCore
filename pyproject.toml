[project]
name = "verdictcore"
version = "0.5.0"
description = "Deterministic, explainable, audit-ready decision engine framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Aida Solat" }
]
keywords = [
  "decision-engine",
  "decision-intelligence",
  "explainable-ai",
  "ai-governance",
  "audit-trail",
  "enterprise-ai",
  "mcdm",
  "decision-support",
  "human-in-the-loop",
  "policy-engine"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]

dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "pyyaml>=6.0",
  "rich>=13.0"
]

[project.urls]
Homepage = "https://github.com/aida-solat/verdictcore"
Repository = "https://github.com/aida-solat/verdictcore"
Documentation = "https://github.com/aida-solat/verdictcore#readme"
Changelog = "https://github.com/aida-solat/verdictcore/blob/main/CHANGELOG.md"
Issues = "https://github.com/aida-solat/verdictcore/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10"
]
llm = [
  "openai>=1.0",
  "anthropic>=0.25"
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5"
]

[project.scripts]
verdict = "verdictcore.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verdictcore"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
